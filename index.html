<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Map Game</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="cameraMode" class="camera-mode pan-on" title="Camera pan ON — double-tap to lock">PAN</div>
<canvas id="minimap" title="Explored map — tap to jump there"></canvas>
<div id="info">Tap a red dot or purple base to select</div>
<div id="ui">
  <div id="selectionFilters" class="selection-filters" style="display:none">
    <button type="button" class="filter-chip" data-filter="all" id="filterAll">All</button>
    <button type="button" class="filter-chip" data-filter="worker" id="filterWorkers">Workers</button>
    <button type="button" class="filter-chip" data-filter="soldier" id="filterSoldiers">Soldiers</button>
  </div>
  <div id="mapActions">
    <button id="btnNew">New Map</button>
    <button id="btnResetView">Reset View</button>
  </div>
  <div id="unitActions">
    <button id="btnMove">Move</button>
    <button id="btnCut">Cut</button>
    <button id="btnMine">Mine</button>
    <button id="btnTunnel">Tunnel</button>
    <button id="btnBuild">Build</button>
    <button id="btnRepair">Repair</button>
    <button id="btnCancel">Cancel</button>
  </div>
  <div id="soldierActions">
    <button id="btnSoldierMove">Move</button>
    <button id="btnSoldierAttack">Attack</button>
    <button id="btnSoldierDefend">Defend</button>
    <button id="btnSoldierCancel">Cancel</button>
  </div>
  <div id="groupActions">
    <button id="btnGroupMove">Move</button>
    <button id="btnGroupCut">Cut</button>
    <button id="btnGroupMine">Mine</button>
    <button id="btnGroupRepair">Repair</button>
    <button id="btnGroupAttack">Attack</button>
    <button id="btnGroupDefend">Defend</button>
    <button id="btnGroupCancel">Cancel</button>
  </div>
  <div id="buildMenu">
    <button id="btnBuildBase">Base</button>
    <button id="btnBuildArmory">Armory</button>
    <button id="btnBuildCancel">Cancel</button>
  </div>
  <div id="baseActions">
    <button id="btnTrain">Train</button>
    <button id="btnCancelTrain">✕ Queue</button>
    <button id="btnUpgrade">Upgrade</button>
    <button id="btnCancelBase">Cancel</button>
  </div>
  <div id="armoryActions">
    <button id="btnTrainSoldier">Train Soldier</button>
    <button id="btnCancelTrainSoldier">✕ Queue</button>
    <button id="btnCancelArmory">Cancel</button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/map.js"></script>
<script src="js/fog.js"></script>
<script src="js/pathfinding.js"></script>
<script src="js/actions1.js"></script>
<script src="js/actions2.js"></script>
<script src="js/actions3.js"></script>
<script src="js/actions4.js"></script>
<script src="js/actions5.js"></script>
<script src="js/buildings.js"></script>
<script src="js/training.js"></script>
<script src="js/combat.js"></script>
<script src="js/ui.js"></script>
<script src="js/render.js"></script>
<script src="js/minimap.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>
</body>
</html>
